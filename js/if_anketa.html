<html>
<body>
<script>
let lastName = prompt("Введите вашу фамилию:");
let firstName = prompt("Введите ваше имя:");
let middleName = prompt("Введите ваше отчество:");
let ageYears = +prompt("Введите ваш возраст (в годах):");
let isMale = confirm("Ваш пол - мужской? (OK - мужской, Отмена - женский)");

if (!lastName || !firstName || !middleName || !ageYears) {
    alert("Все поля должны быть заполнены корректно!");
} else {
    let ageDays = ageYears * 365;
    let ageIn5Years = ageYears + 5;
    let gender;
    if (isMale === true) {
        gender = "мужской";
    } else {
        gender = "женский";
    }
    let isRetired;
    if (isMale === true) {
        if (ageYears >= 65) {
            isRetired = true;
        } else {
            isRetired = false;
        }
    } else {
        if (ageYears >= 60) {
            isRetired = true;
        } else {
            isRetired = false;
        }
    }
    
    let retiredText;
    if (isRetired === true) {
        retiredText = "да";
    } else {
        retiredText = "нет";
    }
    
    alert(
        "ваше ФИО: " + lastName + " " + firstName + " " + middleName + "\n" +
        "ваш возраст в годах: " + ageYears + "\n" +
        "ваш возраст в днях: " + ageDays + "\n" +
        "через 5 лет вам будет: " + ageIn5Years + "\n" +
        "ваш пол: " + gender + "\n" +
        "вы на пенсии: " + retiredText
    );
}
</script>
</body>
</html
