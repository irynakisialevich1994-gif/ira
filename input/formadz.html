<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>

body {
    background-color: #f5f5f5;
    margin: 0;
    padding: 20px;
}

div{
max-width: 600px;
background-color: white;
margin: 0 auto;
padding: 20px 8px;
}

h1 {
    text-align: center;
    font-size: 24px;
}

fieldset {
    border-radius: 8px;
    padding: 20px;
    margin: 20px;
}

input, select {
    width: 100%;
    padding: 8px;
    border: 1px solid #ddd;
    border-radius: 4px;
    box-sizing: border-box;
    margin-top: 4px;
}

input:valid, select:valid {
    border-color: #007BFF;
    box-shadow: 0 0 5px rgba(0, 123, 255, 0.3);
}

input:invalid, select:invalid {
    border-color: #dc3545;
}

.hidden {
    display: none;
}

.radio-group {
    display: flex;
    width: 100%;
    justify-content: flex-start;
    box-sizing: border-box;
    margin: 0; 
    padding: 0; 
}

.radio-option {
    display: flex;
    margin: 0;
}

.radio-option input[type="radio"] {
    box-shadow: none;
    width: 16px; 
    height: 16px;
    margin-right: 8px;
}

.radio-option label {
    white-space: nowrap;
}

.checkbox-group {
    display: flex;
    white-space: nowrap;
}

.checkbox-group input[type="checkbox"] {
    margin-right: 8px;
    width: 16px;
    height: 16px;
}
.legend {
    color:#555
}

.email-password-row{
    display: flex;
    justify-content: flex-start; 
    gap: 15px;
    width: 100%;
    padding-left: 0;
    margin: 0;
}
.email-password-row > div {
    width: 50%;
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


button {
background-color:#007BFF;
color: white;
border: none;
width: 100%;
padding: 8px;

}
button:hover {
background-color:#0056b3;
}

.time-hidden {
    display: none;
}

#date:valid ~ .time-hidden {
    display: block;
    }
    

@media (max-width: 480px) {
    h1 {
    text-align: center;
    font-size: 20px;
    box-sizing: border-box;
}
    
    div {
        max-width: 100%;
        padding: 10px 5px;
        margin: 0;
        width: 100%;
        box-sizing: border-box;
    }
    
    body {
        padding: 0; 
        margin: 0;
        overflow-x: hidden;
    }
    
    fieldset {
        margin: 8px 0;
        padding: 12px 4px;
    }

    .radio-group {
        flex-direction: column;
        gap: 10px;
        align-items: flex-start;
        gap: 0px;
    }
    
    .radio-option {
        width: 100%;
        margin-bottom: 4px;
    }
    
    .checkbox-group {
        width: 100%;
        margin-top: 10px;
        white-space: normal;
    }
    
    fieldset {
        min-width: 0;
        width: 100%;
        box-sizing: border-box;
        margin: 8px 0;
        padding: 12px 8px;
    }
       label {
        font-size: 14px;
    }
    input::placeholder {
        font-size: 12px;
    }
    
}

</style>
<body>
    <div>
        <form method="post" action="https://fe.it-academy.by/TestForm.php">
            <h1> Регистрация на онлайн курс</h1>
            <fieldset>
                <legend>Личные данные</legend>
                    <label for="name">ФИО*</label><br>
                    <input type="text" id="name" name="name" placeholder="Иванов Иван Иванович" required>
        
                    <div class="email-password-row">
                        <div>
                            <label for="email">Email*</label>
                            <input type="email" id="email" name="email" placeholder="example@mail.com" required>
                    </div>
                        <div>
                            <label>Пароль*</label>
                            <input type="password" name="password" maxlength="8" placeholder="Не менее 8 символов" required>
                        </div>
                    </div>
            </fieldset>

            <fieldset>
                <legend>Выбор курса</legend>
                    <label for="courses">Курс*</label><br>
                    <select id="courses" name="courses" required>
                    <option value="" selected disabled>Выберите курс</option>
                    <option value="web">Веб-разработка</option>
                    <option value="Science">Data Science</option>
                    <option value="Design">Графический дизайн</option>
                    </select>
                    <br><br>

                    <label for="date">Даты начала*</label><br>
                    <input type="date" id="date" name="date" min="2024-01-01" value="дд.мм.гггг" required>

                    <label class="time-hidden">Предпочитаемое время занятий (13:00 - 20:00)<br>
                    <select id="time-hidden" name="time-hidden">
                    <option value="">--:--</option>
                    <option value="13:00">13:00</option>
                    <option value="14:00">14:00</option>
                    <option value="15:00">15:00</option>
                    <option value="16:00">16:00</option>
                    <option value="17:00">17:00</option>
                    <option value="18:00">18:00</option>
                    <option value="19:00">19:00</option>
                    <option value="20:00">20:00</option>
                    </select>
                    </label>
                    <br><br>
            </fieldset>

            <fieldset>
                <legend>Дополнительно</legend>
                    <p>Опыт в ИТ</p>
                    <div class="radio-group">
                        <div class="radio-option">
                            <input type="radio" id="skill_none" name="option" value="skill_none">
                            <label for="skill_none">Нет опыта</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="skill_jun" name="option" value="skill_jun">
                            <label for="skill_jun">Начинающий</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="skill_top" name="option" value="skill_top" checked>
                            <label for="skill_top">Опытный</label>
                        </div>
                    </div>

                    <div class="checkbox-group">
                        <input type="checkbox" id="agreement" name="agreement" value="yes" required>
                        <label for="agreement">Я согласен на обработку персональных данных*</label>
                    </div>
            </fieldset>
            <button type="submit">Отправить заявку</button>
        </form>
    </div>
</body>
</html>
