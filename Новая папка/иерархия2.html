<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping</title>
  
  <style>

    table {
      border-collapse: collapse;
    }

    table tr {
        color: #696969;
        border-bottom: 1px solid #eee;
    }

    th,td{
        min-width: 150px;
        padding: 10px;
        height: 20px;
    } 


    th {
        text-align: left;
        color: #fff;
        background-color: #706d97;
    }

    th:last-child{
        text-align: right;
    }

    tr td:nth-of-type(1),
    tr th:nth-of-type(1){
        width:150px !important;
        min-width: 0;
    } 

    tr td:nth-of-type(3),
    tr th:nth-of-type(3){
        width: 80px;
        min-width: 0;
        text-align: right;
    }

    tr:nth-of-type(even){
        background-color: #eee;
    }
  </style>
</head>
<body>
  <table>
