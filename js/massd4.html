function getAverageRating(book) {
    if (!book.ratings || book.ratings.length === 0) {
        return 0;
    }
    let sum = 0;
    for (let i = 0; i < book.ratings.length; i++) {
        sum += book.ratings[i].rating;
    }
    const average = sum / book.ratings.length;
    return average;
}
