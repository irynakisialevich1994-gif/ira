<html>
<body>
<script>
let x = +prompt("Введите координату X:");
let y = +prompt("Введите координату Y:");

if (isNaN(x) || isNaN(y)) {
    alert("Некорректные координаты!");
} else {
if (x > 0 && y > 0) {
    quadrant = "1";
} else if (x < 0 && y > 0) {
    quadrant = "2";
} else if (x < 0 && y < 0) {
    quadrant = "3";
} else if (x > 0 && y < 0) {
    quadrant = "4";
} else {
    quadrant = "на оси или в центре";
}
    alert("Точка находится в " + quadrant + " четверти");
};
</script>
</body>
</html>
